<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Set to 100% of the viewport/form area */
        model-viewer {
            width: 100vw;
            height: 100vh;
            --progress-bar-color: #0078D4;
        }
    </style>
</head>
<body>

    <model-viewer id="modelViewer"
                  src="###GLB_FILE_PATH###"
                  alt="3D Model"
                  shadow-intensity="1"
                  camera-controls
                  auto-rotate
                  ar>
    </model-viewer>

</body>
</html>
